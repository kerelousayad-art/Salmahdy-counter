<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmahdy Counter ️</title>

<!-- خط Cairo من Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Cairo', sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top right, #312e81, #1e1b4b, #0f172a);
  color:white;
  padding:20px;
  overflow-x:hidden;
}

.container{
  width:100%;
  max-width:900px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:1;
}

h1{
  font-size:2.4rem;
  font-weight:900;
  margin-bottom:30px;
  text-shadow:0 0 20px rgba(255,158,207,.3);
  letter-spacing:-0.5px;
}

.grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(110px, 1fr));
  gap:16px;
}

.box{
  position:relative;
  padding:22px 12px;
  border-radius:20px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 12px 30px rgba(0,0,0,.3);
  transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow:hidden;
}

.box::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
  transition:.6s;
}

.box:hover{
  transform:translateY(-6px) scale(1.02);
  border-color:rgba(255,158,207,.4);
}

.box:hover::before{
  left:100%;
}

.box span{
  display:block;
  font-size:2.2rem;
  font-weight:900;
  color:#fff;
  margin-bottom:4px;
  font-feature-settings:"tnum";
}

.box p{
  font-size:0.95rem;
  opacity:.8;
  font-weight:600;
}

.footer-text{
  margin-top:45px;
  width:90%;
  max-width:650px;
  font-size:1.15rem;
  font-weight:600;
  line-height:1.8;
  padding:22px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}

.footer-text span{
  display:block;
  margin-top:8px;
  font-size:1.3rem;
  font-weight:700;
  color:#ff9ecf;
}

/* زرار المزيكا */
.music-btn{
  position:fixed;
  bottom:25px;
  right:25px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(10px);
  color:white;
  padding:12px 20px;
  border-radius:50px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Cairo', sans-serif;
  font-size:0.95rem;
  font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  transition:.3s;
  z-index:100;
}

.music-btn:hover{
  background:rgba(255,158,207,0.2);
  transform:scale(1.05);
}

.disk-icon{
  display:inline-block;
  font-size:1.2rem;
  transition:transform 1.5s linear;
}

.spinning{
  animation:spin 3s linear infinite;
}

@keyframes spin{
  100%{ transform:rotate(360deg); }
}

@media(max-width:600px){
  h1{ font-size:1.7rem; margin-bottom:20px; }
  .grid{ grid-template-columns:repeat(3, 1fr); gap:10px; }
  .grid .box:last-child{ grid-column:span 3; } /* يخلي الثواني تاخد العرض كامل تحت */
  .box{ padding:16px 8px; }
  .box span{ font-size:1.6rem; }
  .music-btn{ bottom:15px; right:15px; padding:10px 16px; font-size:0.85rem; }
}
</style>
</head>

<body>

<div class="container">
  <h1>بصي بقالنا قد ايههه مع بعض</h1>

  <div class="grid">
    <div class="box"><span id="years">0</span><p>سنين</p></div>
    <div class="box"><span id="months">0</span><p>شهور</p></div>
    <div class="box"><span id="weeks">0</span><p>أسابيع</p></div>
    <div class="box"><span id="days">0</span><p>أيام</p></div>
    <div class="box"><span id="hours">0</span><p>ساعات</p></div>
    <div class="box"><span id="minutes">0</span><p>دقايق</p></div>
    <div class="box"><span id="seconds">0</span><p>ثواني</p></div>
  </div>

  <div class="footer-text">
    عارفه لو وقففف 🔪
    <span>عقبال م نكمل 100 سنة يلولييي </span>
  </div>
</div>

<!-- مشغل الصوت والزرار -->
<audio id="bgMusic" loop>
  <source src="song.mpeg" type="audio/mp3">
</audio>

<button class="music-btn" id="musicToggle" onclick="toggleAudio()">
  <span class="disk-icon" id="diskIcon">💿</span>
  <span id="musicText">دوسي هناااا</span>
</button>

<script>
const startDate = new Date("2026-04-24T03:26:00");

function updateCounter(){
  const now = new Date();
  let diff = Math.floor((now - startDate)/1000);

  if (diff < 0) diff = 0; // حماية لو التاريخ لسه مجاش

  const years = Math.floor(diff/(365*24*60*60));
  diff %= (365*24*60*60);

  const months = Math.floor(diff/(30*24*60*60));
  diff %= (30*24*60*60);

  const weeks = Math.floor(diff/(7*24*60*60));
  diff %= (7*24*60*60);

  const days = Math.floor(diff/(24*60*60));
  diff %= (24*60*60);

  const hours = Math.floor(diff/(60*60));
  diff %= (60*60);

  const minutes = Math.floor(diff/60);
  const seconds = diff%60;

  document.getElementById("years").innerText = years;
  document.getElementById("months").innerText = months;
  document.getElementById("weeks").innerText = weeks;
  document.getElementById("days").innerText = days;
  document.getElementById("hours").innerText = hours;
  document.getElementById("minutes").innerText = minutes;
  document.getElementById("seconds").innerText = seconds;
}

// تشغيل وقفل المزيكا
const audio = document.getElementById("bgMusic");
const disk = document.getElementById("diskIcon");
const musicText = document.getElementById("musicText");

function toggleAudio(){
  if (audio.paused) {
    audio.play();
    disk.classList.add("spinning");
    musicText.innerText = "وقفي الأغنية";
  } else {
    audio.pause();
    disk.classList.remove("spinning");
    musicText.innerText = "دوسي هناااا";
  }
}

setInterval(updateCounter, 1000);
updateCounter();
</script>

</body>
</html>
